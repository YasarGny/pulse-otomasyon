<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151b27"><title>PULSE | Sesli Bülten</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#151b27;color:#f5f7fa}.wrap{width:100%;max-width:740px;margin:auto;padding:2px}.player{background:linear-gradient(135deg,#202d3c,#141c29);border:1px solid #344052;border-radius:18px;padding:20px 22px;box-shadow:0 12px 25px #0001}.top,.meta,.transport,.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;color:#80e3cf}.date{font-size:11px;color:#b6c5d5}h1{font-size:clamp(20px,4.5vw,27px);letter-spacing:-.035em;margin:14px 0 5px}.subtitle{font-size:12px;color:#a8b8ca;margin:0 0 19px}.transport{justify-content:flex-start;gap:16px}.play{flex:none;width:54px;height:54px;border:0;border-radius:50%;background:#7ce5ce;color:#0e2830;font-size:23px;font-weight:800;cursor:pointer}.play:disabled{opacity:.4}.timeline{flex:1;min-width:0}input[type=range]{width:100%;margin:0;accent-color:#7ce5ce;cursor:pointer}.times{display:flex;justify-content:space-between;font-size:11px;color:#bdc9d7;font-variant-numeric:tabular-nums;margin-top:4px}.bottom{border-top:1px solid #344153;padding-top:14px;margin-top:18px;flex-wrap:wrap}.status{font-size:11px;color:#bdcad9;max-width:55%}.settings{display:flex;align-items:center;gap:8px}.settings label{font-size:11px;color:#aebed0}.speed{background:#263447;color:#f1f5fa;border:1px solid #4a5b70;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:700;cursor:pointer}.volume{width:67px}audio{display:none}@media(max-width:400px){.player{padding:16px}.settings{gap:5px}.volume{width:48px}.status{max-width:45%}}
</style></head><body><div class="wrap"><section class="player" aria-label="PULSE sesli bülten"><div class="top"><span class="eyebrow">◉ PULSE / SESLİ BÜLTEN</span><span class="date" id="date">Günlük yayın</span></div><h1>Günün sesli özeti</h1><p class="subtitle">Teknoloji · Yapay zekâ · Yazılım · Otomobil</p><div class="transport"><button id="play" class="play" aria-label="Oynat" disabled>▶</button><div class="timeline"><input id="seek" type="range" min="0" max="1000" value="0" aria-label="İlerleme"><div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div></div></div><div class="bottom"><span class="status" id="status" role="status">Kayıt yükleniyor…</span><div class="settings"><label for="speed">Hız</label><select id="speed" class="speed" aria-label="Oynatma hızı"><option value=".75">0,75×</option><option value="1" selected>1×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option><option value="1.75">1,75×</option><option value="2">2×</option></select><label for="volume">Ses</label><input id="volume" class="volume" type="range" min="0" max="100" value="100" aria-label="Ses düzeyi"></div></div><audio id="audio" preload="metadata" playsinline></audio></section></div><script>
const $=id=>document.getElementById(id),a=$('audio'),p=$('play'),seek=$('seek'),status=$('status');const fmt=n=>Number.isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';function sync(){p.textContent=a.paused?'▶':'Ⅱ';p.setAttribute('aria-label',a.paused?'Oynat':'Duraklat')}p.onclick=async()=>{try{if(a.paused)await a.play();else a.pause()}catch(e){status.textContent='Oynatma başlatılamadı'}sync()};a.addEventListener('play',()=>{status.textContent='Çalıyor';sync()});a.addEventListener('pause',sync);a.addEventListener('ended',()=>{status.textContent='Tamamlandı';sync()});a.addEventListener('loadedmetadata',()=>{$('duration').textContent=fmt(a.duration);status.textContent='Dinlemeye hazır'});a.addEventListener('timeupdate',()=>{$('current').textContent=fmt(a.currentTime);if(a.duration>0&&Number.isFinite(a.duration))seek.value=Math.round(a.currentTime/a.duration*1000)});a.addEventListener('error',()=>{status.textContent='Ses kaydı yüklenemedi';p.disabled=true});seek.oninput=()=>{if(a.duration>0&&Number.isFinite(a.duration))a.currentTime=a.duration*seek.value/1000};$('speed').onchange=e=>{a.playbackRate=Number(e.target.value);a.preservesPitch=true};$('volume').oninput=e=>a.volume=Number(e.target.value)/100;(async()=>{try{const r=await fetch('./latest.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();if(!/^[-\w./]+\.mp3$/.test(d.audio||'')||d.audio.includes('..'))throw Error();a.src='./'+d.audio+'?v='+encodeURIComponent(d.date||'latest');$('date').textContent=d.date||'Günlük yayın';p.disabled=false;status.textContent='Dinlemeye hazır'}catch(e){status.textContent='Günlük ses henüz hazır değil'}})();
</script></body></html>
