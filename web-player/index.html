<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172332"><title>PULSE — Sesli Bülten</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--accent:#59dfc7;--muted:#afc0d1}*{box-sizing:border-box}body{margin:0;background:#141c28;color:#f7fafc}.wrap{width:100%;max-width:740px;margin:auto;padding:3px}.player{background:linear-gradient(125deg,#203347,#152232 80%);border:1px solid #334b5e;border-radius:17px;padding:19px 22px 16px;min-width:0}.brand{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--accent)}.date{font-size:11px;color:var(--muted);margin-top:8px;display:block}.top{padding-right:40px}h1{font-size:clamp(21px,4.5vw,27px);letter-spacing:-.035em;line-height:1.25;margin:15px 0 5px}.subtitle{font-size:12px;color:var(--muted);margin:0 0 17px}.transport{display:flex;align-items:center;gap:16px}.play{flex:0 0 56px;height:56px;border:0;border-radius:50%;background:var(--accent);color:#0b2931;display:grid;place-items:center;cursor:pointer}.play svg{width:56px;height:56px;fill:currentColor;display:block}.play:disabled{opacity:.45;cursor:default}.timeline{flex:1;min-width:0}input[type=range]{width:100%;margin:0;accent-color:var(--accent);cursor:pointer;touch-action:pan-y}.times{display:flex;justify-content:space-between;font-size:11px;color:#c4d1dd;font-variant-numeric:tabular-nums;margin-top:5px}.bottom{padding-top:6px;margin-top:8px;margin-left:72px;display:flex;align-items:center}.settings{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%}.speed{border:1px solid #425e72;background:#223649;color:#dcebf4;border-radius:999px;min-width:72px;height:30px;padding:4px 11px;font-size:11px;font-weight:700;cursor:pointer}.speed:hover{border-color:#79a8b5}.sound{display:flex;align-items:center;gap:9px;color:#bdcddc}.volume{width:78px}.sound svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}audio{display:none}@media(max-width:390px){.player{padding:17px 15px}.brand{font-size:10px}.bottom{margin-left:70px}.settings{gap:10px}.volume{width:58px}.speed{min-width:67px;padding:5px 9px}.status{font-size:10px}}@media(prefers-reduced-motion:no-preference){.play{transition:transform .15s,background .15s}.play:active{transform:scale(.95)}}
</style></head><body><main class="wrap"><section class="player" aria-label="PULSE sesli bülten"><header class="top"><div class="brand">PULSE <span aria-hidden="true">·</span> SESLİ BÜLTEN</div><span id="date" class="date">Günlük yayın</span></header><h1>Günün sesli özeti</h1><p class="subtitle">Teknoloji · Yapay zekâ · Yazılım · Otomobil</p><div class="transport"><button id="play" class="play" aria-label="Oynat" disabled><svg viewBox="0 0 56 56" aria-hidden="true"><path d="M20.8 13.5 L20.8 42.5 L42.3 28 Z"/></svg></button><div class="timeline"><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Ses kaydında ilerle"><div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div></div></div><div class="bottom"><div class="settings"><button class="speed" id="speed" aria-label="Oynatma hızı: 1 kat" title="Hızı değiştir">Hız · 1×</button><label class="sound" for="volume"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm13-1a6 6 0 0 1 0 8m2-11a10 10 0 0 1 0 14"/></svg><input id="volume" class="volume" type="range" min="0" max="100" value="100" aria-label="Ses düzeyi"></label></div></div><audio id="audio" preload="metadata" playsinline></audio></section></main>
<script>
const $=id=>document.getElementById(id),a=$('audio'),play=$('play'),seek=$('seek'),speed=$('speed');const speeds=[1,1.25,1.5,1.75,2,.75];let speedIndex=0,loaded=false,failed=false;
const fmt=n=>Number.isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
function refresh(){play.innerHTML=a.paused?'<svg viewBox="0 0 56 56" aria-hidden="true"><path d="M20.8 13.5 L20.8 42.5 L42.3 28 Z"/></svg>':'<svg viewBox="0 0 56 56" aria-hidden="true"><rect x="18" y="14" width="7" height="28" rx="1.5"/><rect x="31" y="14" width="7" height="28" rx="1.5"/></svg>';play.setAttribute('aria-label',a.paused?'Oynat':'Duraklat');play.disabled=!loaded||failed}
play.onclick=async()=>{if(!loaded||failed)return;try{if(a.paused)await a.play();else a.pause()}catch(e){console.warn('Audio playback failed',e)}refresh()};
['play','pause','ended','waiting','playing','seeked'].forEach(event=>a.addEventListener(event,refresh));
a.addEventListener('loadedmetadata',()=>{$('duration').textContent=fmt(a.duration);refresh()});
a.addEventListener('timeupdate',()=>{$('current').textContent=fmt(a.currentTime);if(Number.isFinite(a.duration)&&a.duration>0)seek.value=Math.round(a.currentTime/a.duration*1000)});
a.addEventListener('error',()=>{failed=true;play.disabled=true;refresh()});
seek.oninput=()=>{if(Number.isFinite(a.duration)&&a.duration>0)a.currentTime=a.duration*Number(seek.value)/1000};
speed.onclick=()=>{speedIndex=(speedIndex+1)%speeds.length;const rate=speeds[speedIndex];a.playbackRate=rate;a.defaultPlaybackRate=rate;a.preservesPitch=true;speed.textContent='Hız · '+String(rate).replace('.',',')+'×';speed.setAttribute('aria-label','Oynatma hızı: '+String(rate).replace('.',',')+' kat')};
$('volume').oninput=e=>a.volume=Number(e.target.value)/100;
(async()=>{try{const r=await fetch('./latest.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();if(!/^[-\w./]+\.mp3$/.test(d.audio||'')||d.audio.includes('..'))throw Error();a.src='./'+d.audio+'?v='+encodeURIComponent(d.date||'latest');$('date').textContent=d.date||'Günlük yayın';loaded=true;play.disabled=false;refresh()}catch(e){failed=true;refresh()}})();
</script></body></html>
