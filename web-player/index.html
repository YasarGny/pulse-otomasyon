<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172332"><title>PULSE — Sesli Bülten</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--accent:#59dfc7;--muted:#afc0d1}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-width:0}body{background:transparent;color:#f7fafc}
.wrap{width:100%;max-width:740px;margin:auto;padding:3px}
.player{background:linear-gradient(125deg,#203347,#152232 80%);border:1px solid #334b5e;border-radius:17px;padding:19px 22px 16px;min-width:0;overflow:hidden}
.top{padding-right:40px}.brand{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--accent)}.date{font-size:11px;color:var(--muted);margin-top:8px;display:block}
h1{font-size:clamp(21px,4.5vw,27px);letter-spacing:-.035em;line-height:1.25;margin:15px 0 5px}
.subtitle{font-size:12px;color:var(--muted);margin:0 0 17px}
.transport{display:flex;align-items:center;gap:16px;min-width:0}
.play{appearance:none;-webkit-appearance:none;flex:0 0 56px;width:56px;min-width:56px;max-width:56px;height:56px;min-height:56px;max-height:56px;aspect-ratio:1;border:0;padding:0;border-radius:50%;background:var(--accent);color:#0b2931;display:grid;place-items:center;overflow:hidden;cursor:pointer}
.play svg{display:block;flex:none;width:56px;height:56px;fill:currentColor}
.play:disabled{opacity:.55;cursor:default}
.timeline{flex:1 1 0;min-width:0}
.range-wrap{height:32px;display:flex;align-items:center;min-width:0}
input[type=range]{appearance:none;-webkit-appearance:none;display:block;width:100%;min-width:0;height:32px;margin:0;padding:0;background:transparent;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:5px;background:linear-gradient(to right,var(--accent) 0 var(--progress,0%),#405465 var(--progress,0%) 100%);border-radius:99px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;border:2px solid #17283a;background:var(--accent);margin-top:-5px}
input[type=range]::-moz-range-track{height:5px;background:#405465;border-radius:99px}
input[type=range]::-moz-range-progress{height:5px;background:var(--accent);border-radius:99px}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:2px solid #17283a;background:var(--accent);border-radius:50%}
.times{display:flex;justify-content:space-between;font-size:11px;color:#c4d1dd;font-variant-numeric:tabular-nums;margin-top:1px}
.bottom{margin-top:15px;display:flex;justify-content:center;align-items:center}
.settings{display:grid;grid-template-columns:104px 1px 110px;column-gap:16px;align-items:center;justify-content:center;width:max-content;max-width:100%}
.divider{width:1px;height:24px;background:#405465}
.speed{appearance:none;-webkit-appearance:none;display:flex;align-items:center;justify-content:center;gap:6px;width:104px;min-width:104px;max-width:104px;height:34px;padding:0 8px;border:1px solid #425e72;border-radius:999px;background:#223649;color:#dcebf4;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
.speed-value{display:block;flex:0 0 48px;width:48px;text-align:center;font-variant-numeric:tabular-nums}
.speed-icon{display:block;flex:none;width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sound{display:grid;grid-template-columns:17px 1fr;align-items:center;gap:9px;width:110px;min-width:110px;color:#bdcddc}
.sound svg{display:block;width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.volume{width:84px}
.sound .range-wrap{height:32px}
button:focus-visible,input:focus-visible{outline:2px solid #e7fef9;outline-offset:3px}
.speed:hover{border-color:#79a8b5}
.status{margin:9px 0 0;text-align:center;font-size:11px;color:#c4d1dd}
.status[hidden]{display:none}
audio{display:none}
@media(max-width:390px){.player{padding:17px 15px}.brand{font-size:10px}.transport{gap:12px}.settings{grid-template-columns:104px 1px 98px;column-gap:12px}.sound{width:98px;min-width:98px}.volume{width:72px}}
@media(max-width:300px){.player{padding:14px 10px}.settings{grid-template-columns:96px 1px 88px;column-gap:8px}.speed{width:96px;min-width:96px;max-width:96px}.sound{width:88px;min-width:88px;gap:6px}.volume{width:65px}.transport{gap:9px}}
@media(prefers-reduced-motion:no-preference){.play{transition:background .15s}.play:active{filter:brightness(.92)}}
</style></head><body><main class="wrap"><section class="player" aria-label="PULSE sesli bülten"><header class="top"><div class="brand">PULSE <span aria-hidden="true">·</span> SESLİ BÜLTEN</div><span id="date" class="date">Günlük yayın</span></header><h1>Günün sesli özeti</h1><p class="subtitle">Teknoloji · Yapay zekâ · Yazılım · Otomobil</p><div class="transport"><button id="play" class="play" aria-label="Oynat" disabled><svg viewBox="0 0 56 56" aria-hidden="true"><path d="M20.8 13.5 L20.8 42.5 L42.3 28 Z"/></svg></button><div class="timeline"><div class="range-wrap"><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Ses kaydında ilerle"></div><div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div></div></div><div class="bottom"><div class="settings"><button class="speed" id="speed" aria-label="Oynatma hızı: 1 kat" title="Hızı değiştir"><svg class="speed-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg><span class="speed-value">1×</span></button><span class="divider" aria-hidden="true"></span><label class="sound" for="volume"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm13-1a6 6 0 0 1 0 8m2-11a10 10 0 0 1 0 14"/></svg><span class="range-wrap"><input id="volume" class="volume" type="range" min="0" max="100" value="100" aria-label="Ses düzeyi"></span></label></div></div><p id="status" class="status" role="status" aria-live="polite" hidden></p><audio id="audio" preload="metadata" playsinline></audio></section></main>
<script>
const $=id=>document.getElementById(id),a=$('audio'),play=$('play'),seek=$('seek'),speed=$('speed');const speeds=[1,1.1,1.2,1.25,1.5,1.75,2,.75];let speedIndex=0,loaded=false,failed=false;const status=$('status');const setStatus=t=>{status.textContent=t;status.hidden=!t};const paint=(el)=>el.style.setProperty('--progress',Math.max(0,Math.min(100,100*Number(el.value)/Number(el.max)))+'%');paint(seek);paint($('volume'));
const fmt=n=>Number.isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
function refresh(){play.innerHTML=a.paused?'<svg viewBox="0 0 56 56" aria-hidden="true"><path d="M20.8 13.5 L20.8 42.5 L42.3 28 Z"/></svg>':'<svg viewBox="0 0 56 56" aria-hidden="true"><rect x="18" y="14" width="7" height="28" rx="1.5"/><rect x="31" y="14" width="7" height="28" rx="1.5"/></svg>';play.setAttribute('aria-label',a.paused?'Oynat':'Duraklat');play.disabled=!loaded||failed}
play.onclick=async()=>{if(!loaded||failed)return;try{if(a.paused)await a.play();else a.pause()}catch(e){console.warn('Audio playback failed',e)}refresh()};
['play','pause','ended','waiting','playing','seeked'].forEach(event=>a.addEventListener(event,refresh));a.addEventListener('waiting',()=>{if(loaded&&!a.paused)setStatus('Ses yükleniyor…')});a.addEventListener('playing',()=>setStatus(''));a.addEventListener('canplay',()=>{if(!failed)setStatus('')});
a.addEventListener('loadedmetadata',()=>{$('duration').textContent=fmt(a.duration);refresh()});
a.addEventListener('timeupdate',()=>{$('current').textContent=fmt(a.currentTime);if(Number.isFinite(a.duration)&&a.duration>0){seek.value=Math.round(a.currentTime/a.duration*1000);paint(seek)}});
a.addEventListener('error',()=>{failed=true;play.disabled=true;setStatus('Ses kaydı yüklenemedi. Sayfayı yenileyin.');refresh()});
seek.oninput=()=>{paint(seek);if(Number.isFinite(a.duration)&&a.duration>0)a.currentTime=a.duration*Number(seek.value)/1000};
speed.onclick=()=>{speedIndex=(speedIndex+1)%speeds.length;const rate=speeds[speedIndex];a.playbackRate=rate;a.defaultPlaybackRate=rate;a.preservesPitch=true;speed.querySelector('.speed-value').textContent=String(rate).replace('.',',')+'×';speed.setAttribute('aria-label','Oynatma hızı: '+String(rate).replace('.',',')+' kat')};
$('volume').oninput=e=>{a.volume=Number(e.target.value)/100;paint(e.target)};
let activeVersion='',pendingAudio=null;
async function checkLatest(){
 try{
  const r=await fetch('./latest.json?nocache='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
  if(!r.ok)throw Error('metadata');
  const d=await r.json();
  if(!/^[-\\w./]+\\.mp3$/.test(d.audio||'')||d.audio.includes('..'))throw Error('audio');
  const version=String(d.version||d.date||'latest');
  if(version===activeVersion&&loaded)return;
  const nextSrc='./'+d.audio+'?v='+encodeURIComponent(version);
  if(loaded&&!a.paused&&!a.ended){pendingAudio={src:nextSrc,version,date:d.date};return}
  activeVersion=version;pendingAudio=null;loaded=true;failed=false;
  a.src=nextSrc;a.load();$('date').textContent=d.date||'Günlük yayın';
  $('current').textContent='0:00';$('duration').textContent='0:00';seek.value=0;paint(seek);setStatus('');refresh();
 }catch(e){if(!loaded){failed=true;setStatus('Ses kaydı bilgisi alınamadı. Tekrar deneniyor…');refresh()}}
}
a.addEventListener('pause',()=>{if(pendingAudio)checkLatest()});
a.addEventListener('ended',()=>{if(pendingAudio)checkLatest()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkLatest()});
window.addEventListener('pageshow',()=>checkLatest());
checkLatest();setInterval(checkLatest,60000);
</script></body></html>
