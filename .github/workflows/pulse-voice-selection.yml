name: PULSE Six Short Voice Tests (Temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install requests
      - name: Six different Necdet voices with Yaşar 3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PULSE_YASAR_VOICE_ID: voice_p94xlklc2103
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pulse_podcast_audio as audio

          candidates = {
              "necdet-1": "voice_f9j8iskjzeqc",
              "necdet-4": "voice_bb81iykarlon",
              "necdet-5": "voice_vbozaw08r6hv",
              "necdet-6": "voice_t53vbt24f9js",
              "necdet-7": "voice_013isn56gi20",
              "necdet-8": "voice_n5xry8242n1v",
          }
          turns = [
              {"speaker":"Yaşar","text":"Necdet, bugün telefonlardaki yapay zekâyı konuşalım. Sence gerçekten hayatımızı kolaylaştırıyor mu?"},
              {"speaker":"Necdet","text":"Bazen evet. Ama bana kalırsa asıl marifet, internet yokken de işe yaraması. Her küçük işlem için buluta bağlanmak pek akıllıca değil."},
              {"speaker":"Yaşar","text":"Katılıyorum. Bir de bütün bunları yaparken telefonun şarjı akşama kadar dayansın istiyorum."},
              {"speaker":"Necdet","text":"Kesinlikle Yaşar! Yoksa yapay zekâ çok akıllı olsa ne olur? Biz yine priz ararken buluruz kendimizi."},
          ]
          output = Path("voice-tests")
          output.mkdir(exist_ok=True)
          manifest = []
          for name, voice_id in candidates.items():
              audio.VOICES["Necdet"] = voice_id
              print("Testing Yaşar 3 +", name, flush=True)
              target = output / (name + ".mp3")
              info = audio.render(turns, target)
              if info["duration"] > 60:
                  raise RuntimeError(f"{name} exceeds 60 seconds: {info['duration']}")
              manifest.append({"candidate":name,"necdet_voice_id":voice_id,
                               "yasar_voice_id":audio.VOICES["Yaşar"],
                               "duration_seconds":info["duration"],"file":target.name})
              (output/"manifest.json").write_text(
                  json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8")
              print("Saved", target, info["duration"], "seconds", flush=True)
          print("All six comparison clips ready. No new voice profiles created.")
          PY
      - name: Download completed tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-six-short-podcast-tests
          path: voice-tests/
          if-no-files-found: warn
          retention-days: 7
