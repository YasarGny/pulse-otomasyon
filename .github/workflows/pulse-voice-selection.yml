name: PULSE Turkish Voice Comparison (Temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read four existing voices with one identical Turkish script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m pip install 'google-genai>=2.25.0,<3'
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from google import genai

          voices = {
              "yasar-3": "voice_p94xlklc2103",
              "necdet-4": "voice_bb81iykarlon",
              "necdet-5": "voice_vbozaw08r6hv",
              "necdet-6": "voice_t53vbt24f9js",
          }
          script = (
              "Yaşar, bence yapay zekâda asıl mesele hız değil. "
              "Her yeni model daha güçlü oluyor ama günlük hayatımızı gerçekten kolaylaştırıyor mu? "
              "Örneğin telefondaki yapay zekâ internetsiz çalışsa hem daha hızlı hem de daha özel olur. "
              "Ben biraz da buna bakıyorum."
          )
          out = Path("voice-comparison")
          out.mkdir(exist_ok=True)
          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          for name, voice_id in voices.items():
              print("Synthesizing existing voice:", name, flush=True)
              response = client.interactions.create(
                  model="gemini-3.8-flash-tts",
                  input=[{"type": "user_input", "content": [{
                      "type": "text", "text": script,
                      "annotations": [{"type": "speech_metadata",
                                       "style": "Konuşma dili Türkçe. Doğal, samimi ve sakin teknoloji sohbeti; haber spikeri gibi okuma."}]
                  }]}],
                  response_format={"type": "audio"},
                  generation_config={"speech_config": [{"voice": voice_id}]},
              )
              audio = response.output_audio
              if not audio or not audio.data:
                  raise RuntimeError("Missing audio for " + name)
              raw = audio.data
              wav = base64.b64decode(raw) if isinstance(raw, str) else bytes(raw)
              if wav[:4] != b"RIFF" or len(wav) < 5000:
                  raise RuntimeError("Invalid WAV for " + name)
              (out / (name + ".wav")).write_bytes(wav)
              print("Completed", name, len(wav), "bytes", flush=True)
          (out / "voice-ids.json").write_text(
              json.dumps(voices, indent=2), encoding="utf-8")
          print("Four Turkish comparison clips ready. No new voices created.")
          PY
      - name: Download comparisons
        uses: actions/upload-artifact@v4
        with:
          name: pulse-turkish-voice-comparison
          path: voice-comparison/
          if-no-files-found: error
          retention-days: 7
