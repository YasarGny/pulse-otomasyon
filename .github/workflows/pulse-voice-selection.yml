name: PULSE Recover Existing Voice Previews
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve saved voice previews without creating new voices
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m pip install 'google-genai>=2.25.0,<3'
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from google import genai

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          out = Path("voice-recovery")
          out.mkdir(exist_ok=True)
          wanted = {"PULSE Necdet 4", "PULSE Necdet 5", "PULSE Necdet 6"}
          saved = [{"name": "Yaşar 3", "id": "voice_p94xlklc2103", "file": "previous-selection"}]
          response = client.voices.list(type_=["prompted"], language_code=["tr-TR"])
          matched = {}
          for item in response.voices or []:
              name = item.display_name or ""
              if name in wanted and name not in matched:
                  matched[name] = item.id
          missing = sorted(wanted - set(matched))
          if missing:
              raise RuntimeError("Stored voices not found: " + ", ".join(missing))
          for name in sorted(wanted):
              voice_id = matched[name]
              voice = client.voices.get(id=voice_id)
              audio = getattr(voice, "sample_audio", None)
              if not audio or not getattr(audio, "data", None):
                  raise RuntimeError("No saved sample for " + name)
              raw = audio.data
              data = base64.b64decode(raw) if isinstance(raw, str) else bytes(raw)
              if data[:4] != b"RIFF":
                  raise RuntimeError("Unexpected WAV format for " + name)
              filename = name.lower().replace("pulse ", "").replace(" ", "-") + ".wav"
              (out / filename).write_bytes(data)
              saved.append({"name": name, "id": voice_id, "file": filename})
              print("Recovered:", name, voice_id)
          (out / "voice-ids.json").write_text(
              json.dumps(saved, ensure_ascii=False, indent=2), encoding="utf-8")
          print("Recovered all three existing voice previews; created zero new voices.")
          PY
      - name: Upload recovered previews
        uses: actions/upload-artifact@v4
        with:
          name: pulse-recovered-necdet-voices
          path: voice-recovery/
          if-no-files-found: error
          retention-days: 7
