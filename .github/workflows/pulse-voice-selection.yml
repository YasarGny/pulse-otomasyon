name: PULSE Two-Host Podcast Pilot (Temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audio processing tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: Render Yaşar 3 and Necdet 7 conversation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PULSE_YASAR_VOICE_ID: voice_p94xlklc2103
          PULSE_NECDET_VOICE_ID: voice_013isn56gi20
        run: |
          python -m pip install requests
          python - <<'PY'
          import json
          from pathlib import Path
          from pulse_podcast_audio import render

          turns = [
              {"speaker":"Yaşar","text":"Selam Necdet! Bugün telefonlardaki yapay zekâyı konuşalım. Her yeni model daha akıllı diyorlar ama ben hâlâ şarj aletimi yanımda taşıyorum. Bir gariplik yok mu?"},
              {"speaker":"Necdet","text":"Var tabii! Telefon düşünmeyi öğreniyor ama günün sonunda yine priz arıyoruz. Şaka bir yana, asıl mesele yapay zekânın telefonda mı, bulutta mı çalıştığı."},
              {"speaker":"Yaşar","text":"Tam da onu soracaktım. Mesela internetsizken fotoğraf düzenleyebilsem, konuşmalarımı çevirebilsem... Hem daha hızlı olmaz mı?"},
              {"speaker":"Necdet","text":"Çoğu durumda evet. Üstelik verilerin cihazdan çıkmaması mahremiyet açısından da avantaj. Ama güçlü modeller işlemciyi yoruyor. İşte o noktada pil, ısınma ve performans arasında denge gerekiyor."},
              {"speaker":"Yaşar","text":"Yani telefon üreticilerinin bize daha fazla özellik göstermesi yetmiyor. O özellikleri gün boyunca rahatça kullanabilmemiz gerekiyor."},
              {"speaker":"Necdet","text":"Kesinlikle. Bir de şu var: Her iş için devasa bir model şart değil. Küçük, iyi optimize edilmiş modeller bazen günlük kullanımda daha mantıklı. Mesela bildirimleri özetlemek için veri merkezine koşmaya gerek yok."},
              {"speaker":"Yaşar","text":"Güzel örnek. Benim istediğim de bu zaten: Yapay zekâ beni daha fazla ayar yapmaya zorlamasın, arka planda gerçekten işimi kolaylaştırsın."},
              {"speaker":"Necdet","text":"Aynen. İyi teknoloji kendini sürekli hatırlatmaz. Sen işini yaparsın, o yardımcı olur. Hatta bazen kullandığını bile fark etmezsin."},
              {"speaker":"Yaşar","text":"Peki senin için iyi bir telefon yapay zekâsının ilk şartı ne? Hız mı, gizlilik mi, pil ömrü mü?"},
              {"speaker":"Necdet","text":"Önce güvenilirlik derim. Yanlış bilgi verip çok hızlı cevaplamasının kimseye faydası yok. Sonra gizlilik ve pil. Hız zaten bunların yanında gelmeli."},
              {"speaker":"Yaşar","text":"Güzel. Demek ki daha akıllı telefon demek sadece daha büyük model demek değil. Kullanıcıya daha az zahmet, daha fazla fayda demek."},
              {"speaker":"Necdet","text":"Tam olarak öyle. Yeni Sekme'nin bu kısa denemesinde bunu konuşmuş olduk. Bir sonraki bölümde gerçek haberlerle devam ederiz."},
              {"speaker":"Yaşar","text":"Dinlediğiniz için teşekkürler. Görüşmek üzere!"},
          ]
          Path("pilot-output").mkdir(exist_ok=True)
          info = render(turns, Path("pilot-output/yeni-sekme-yasar3-necdet7.mp3"))
          Path("pilot-output/metadata.json").write_text(json.dumps(info, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(info, ensure_ascii=False))
          PY
      - name: Upload pilot without publishing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yeni-sekme-yasar3-necdet7-pilot
          path: pilot-output/
          retention-days: 7
