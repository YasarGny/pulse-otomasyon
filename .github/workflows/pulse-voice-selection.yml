name: PULSE Separate-Speaker Pilot (Temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install 'google-genai>=2.25.0,<3'
      - name: Render independently voiced Turkish conversation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import base64, json, os, subprocess, wave
          from pathlib import Path
          from google import genai

          voices = {"Yaşar": "voice_p94xlklc2103", "Necdet": "voice_013isn56gi20"}
          turns = [
              ("Yaşar", "Selam Necdet. Telefonlardaki yapay zekâ gerçekten işe yarıyor mu, yoksa biraz fazla mı abartıyoruz?"),
              ("Necdet", "Bence ikisi de. Fotoğraf düzenleme ve çeviri güzel, ama bunları yapmak için her seferinde internete bağlanmak zorunda olmak pek akıllıca değil."),
              ("Yaşar", "Kesinlikle. Benim istediğim, telefonun bunları hızlıca ve mümkünse kendi içinde yapması. Peki pil ne olacak?"),
              ("Necdet", "İşte işin püf noktası o. Güçlü model kadar verimli işlemci de gerekiyor. Yoksa akıllı telefon, şarj aletinin en yakın arkadaşı olur."),
              ("Yaşar", "Güzel söyledin. Yani gerçek yenilik, gösterişli özelliklerden çok günlük hayatı kolaylaştırmak."),
              ("Necdet", "Aynen öyle Yaşar. Teknoloji bize hizmet etmeli; biz teknolojiye değil."),
          ]
          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          out = Path("pilot-output")
          out.mkdir(exist_ok=True)
          segments = []
          for i, (speaker, words) in enumerate(turns, 1):
              print(f"Rendering {i}/{len(turns)}: {speaker}", flush=True)
              response = client.interactions.create(
                  model="gemini-3.8-flash-tts",
                  input=[{"type": "user_input", "content": [{
                      "type": "text", "text": words,
                      "annotations": [{"type": "speech_metadata",
                          "style": "Yalnızca Türkçe. Doğal ve samimi bir teknoloji sohbeti. "
                                   "Bu karakterin kendi sesini koru, başka konuşmacıyı taklit etme."}]
                  }]}],
                  response_format={"type": "audio"},
                  generation_config={"speech_config": [{"voice": voices[speaker]}]},
              )
              audio = response.output_audio
              if not audio or not audio.data:
                  raise RuntimeError(f"Missing audio on turn {i}")
              raw = base64.b64decode(audio.data) if isinstance(audio.data, str) else bytes(audio.data)
              if raw[:4] != b"RIFF":
                  raise RuntimeError(f"Unexpected WAV format on turn {i}")
              wav = out / f"turn-{i:02d}-{speaker.lower()}.wav"
              wav.write_bytes(raw)
              segments.append(wav)
          manifest = out / "concat.txt"
          with manifest.open("w", encoding="utf-8") as f:
              for i, wav in enumerate(segments):
                  f.write("file '" + wav.name + "'\n")
                  if i < len(segments)-1:
                      gap = out / f"gap-{i:02d}.wav"
                      subprocess.run(["ffmpeg","-v","error","-y","-f","lavfi","-i",
                                      "anullsrc=r=24000:cl=mono","-t","0.25",
                                      "-c:a","pcm_s16le",str(gap)],check=True)
                      f.write("file '" + gap.name + "'\n")
          subprocess.run(["ffmpeg","-v","error","-y","-f","concat","-safe","0",
                          "-i",str(manifest),"-af","loudnorm=I=-18:TP=-2:LRA=11",
                          "-c:a","libmp3lame","-b:a","128k",
                          str(out/"yeni-sekme-ayri-sesler.mp3")],check=True)
          (out/"metadata.json").write_text(json.dumps({
              "method":"independent single-speaker calls",
              "voices":voices,"turns":len(turns)
          },ensure_ascii=False,indent=2),encoding="utf-8")
          print("Pilot ready. Existing daily podcast not changed.")
          PY
      - name: Upload pilot without publishing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yeni-sekme-ayri-sesler-pilot
          path: pilot-output/
          if-no-files-found: warn
          retention-days: 7
