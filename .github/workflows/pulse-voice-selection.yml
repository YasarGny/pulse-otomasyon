name: PULSE Necdet Thin Voice Audition (Temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create two distinct Necdet voices and speak Turkish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m pip install 'google-genai>=2.25.0,<3'
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from google import genai

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          out = Path("necdet-new")
          out.mkdir(exist_ok=True)
          profiles = [
              ("necdet-7", "Necdet 7", "Türkçe konuşan 30 yaşında erkek. Yaşar'ın orta-alt perdeli tok sesinden belirgin şekilde farklı: doğal olarak daha ince, aydınlık, genç yetişkin tenor tınısı. İstanbul Türkçesi, arkadaşça spontane konuşma, canlı ve hafif esprili. Çocuk sesi, falsetto, radyo spikeri ve yapay oyunculuk değil. Önizlemede yalnızca Türkçe konuş."),
              ("necdet-8", "Necdet 8", "Türkçe konuşan 31 yaşında erkek. Yaşar'ın tok ve rahat sesinden kolayca ayırt edilen daha yüksek orta perde, net ve parlak tını, hafif burun rezonansı, çevik ve akıllı sohbet tarzı. Doğal Türkiye Türkçesi, ölçülü espri, günlük konuşma ritmi. Çocuk sesi veya abartılı ince ses değil. Önizlemede yalnızca Türkçe konuş."),
          ]
          text = ("Yaşar, bence yapay zekâda asıl mesele hız değil. "
                  "Her yeni model daha güçlü oluyor ama günlük hayatımızı gerçekten kolaylaştırıyor mu? "
                  "Örneğin telefondaki yapay zekâ internetsiz çalışsa hem daha hızlı hem de daha özel olur. "
                  "Ben biraz da buna bakıyorum.")
          records = [{"name": "Yaşar 3", "id": "voice_p94xlklc2103", "file": "previous-selection"}]
          for slug, label, prompt in profiles:
              print("Creating:", label, flush=True)
              created = client.voices.create(store=True, voice={
                  "model": "gemini-3.8-flash-tts", "type": "prompted",
                  "display_name": "PULSE " + label, "gender": "male",
                  "language_code": "tr-TR", "prompted": {"input": prompt},
              })
              if not created.id:
                  raise RuntimeError("Missing voice ID for " + label)
              records.append({"name": label, "id": created.id, "file": slug + ".wav"})
              (out / "voice-ids.json").write_text(
                  json.dumps(records, ensure_ascii=False, indent=2), encoding="utf-8")
              print("Saved voice ID:", label, created.id, flush=True)
              response = client.interactions.create(
                  model="gemini-3.8-flash-tts",
                  input=[{"type": "user_input", "content": [{
                      "type": "text", "text": text,
                      "annotations": [{"type": "speech_metadata",
                          "style": "Yalnızca Türkçe, İstanbul Türkçesi. Samimi, doğal ve hafif esprili podcast sohbeti; İngilizceye geçme."}]
                  }]}],
                  response_format={"type": "audio"},
                  generation_config={"speech_config": [{"voice": created.id}]},
              )
              audio = response.output_audio
              if not audio or not audio.data:
                  raise RuntimeError("No Turkish sample for " + label)
              data = base64.b64decode(audio.data) if isinstance(audio.data, str) else bytes(audio.data)
              if data[:4] != b"RIFF" or len(data) < 5000:
                  raise RuntimeError("Invalid WAV for " + label)
              (out / (slug + ".wav")).write_bytes(data)
              print("Saved Turkish text sample:", label, flush=True)
          print("Two distinct voice IDs and Turkish-script samples saved.")
          PY
      - name: Upload previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-necdet-7-8-turkish
          path: necdet-new/
          if-no-files-found: warn
          retention-days: 7
