name: Yeni Sekme Gemini Pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pulse_gemini_pilot.py
      - pulse_podcast_writer.py
      - pulse_podcast_audio.py
      - .github/workflows/pulse-gemini-pilot.yml
permissions:
  contents: write
concurrency:
  group: yeni-sekme-gemini
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install requests
      - name: Generate Gemini multi-speaker pilot
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pulse_gemini_pilot.py
      - name: Publish isolated Gemini pilot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve the newly rendered files while moving onto the latest remote main.
          # Never rebase generated binary audio: simultaneous runs can update the same files.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --mixed origin/main
            git add web-player/pilot-duo-gemini.mp3 web-player/pilot-duo-gemini.json web-player/pilot-duo-gemini-script.json
            if git diff --cached --quiet; then
              echo "Pilot files are already up to date."
              exit 0
            fi
            git commit -m "Publish Yeni Sekme Gemini pilot"
            if git push origin HEAD:main; then
              echo "Pilot published successfully."
              exit 0
            fi
            echo "Remote updated during publish (attempt $attempt); retrying."
            sleep 3
          done
          echo "Could not publish pilot after five attempts."
          exit 1
