name: PULSE Custom Voices Podcast Pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install requests
      - name: Generate isolated Turkish podcast
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PULSE_YASAR_VOICE_ID: voice_glt4mz1jtaeh
          PULSE_NECDET_VOICE_ID: voice_8nqcoox86z5q
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pulse_podcast_audio as audio

          # Pilot only: no speech style metadata, no publishing.
          def natural_parts(turns):
              return [{"type": "text", "text": t["text"],
                       "annotations": [{"type": "speech_metadata", "speaker": t["speaker"]}]}
                      for t in turns]
          audio.make_parts = natural_parts
          turns = [
              {"speaker":"Yaşar","text":"Necdet, şu yapay zekâlı telefonlar gerçekten işimizi kolaylaştırıyor mu sence?"},
              {"speaker":"Necdet","text":"Kolaylaştırıyor ama bir şartla Yaşar. Telefonun pili öğlene kadar bitmeyecek!"},
              {"speaker":"Yaşar","text":"Ben de tam onu diyecektim. Daha akıllı olsun derken sürekli şarj aramayalım."},
              {"speaker":"Necdet","text":"Aynen öyle. İyi teknoloji, kullandığını bile fark etmeden işini kolaylaştıran teknoloji."},
          ]
          out = Path("custom-voice-pilot")
          out.mkdir(exist_ok=True)
          info = audio.render(turns, out/"pulse-yasar3-necdet3.mp3")
          (out/"metadata.json").write_text(json.dumps(info, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(info, ensure_ascii=False))
          PY
      - name: Upload pilot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-custom-yasar3-necdet3-pilot
          path: custom-voice-pilot/
          if-no-files-found: warn
          retention-days: 7
