name: PULSE GitHub daily publication
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and save artifacts without changing the live site
        type: boolean
        default: true
      expanded_issue:
        description: Produce a full researched edition with long podcasts; keeps date and issue
        type: boolean
        default: false
      refresh_media:
        description: Fill missing publisher images without changing news or audio
        type: boolean
        default: false
      refresh_audio:
        description: Revise today's summary and podcast without changing news or issue numbers
        type: boolean
        default: false
  schedule:
    # Owner-approved launch: scheduled production is enabled unless explicitly paused.
    # UTC: Istanbul is UTC+3 year-round. Extra runs recover delayed/failed starts.
    - cron: "0 3 * * *"
    - cron: "15 3 * * *"
    - cron: "20 3 * * *"
    - cron: "30 4 * * *"
    - cron: "0 5 * * *"
    # Bounded late recovery: 08:30/09:00 TRT; already-ready issues skip production.
    - cron: "30 5 * * *"
    - cron: "0 6 * * *"
env:
  PULSE_AUTOMATION_ENABLED: ${{ vars.PULSE_AUTOMATION_ENABLED }}
  PULSE_TECH_PODCAST_ENABLED: ${{ vars.PULSE_TECH_PODCAST_ENABLED }}
  PULSE_GAME_PODCAST_ENABLED: ${{ vars.PULSE_GAME_PODCAST_ENABLED }}
  PULSE_STATE_KEY: ${{ secrets.PULSE_STATE_KEY || secrets.PULSE_DEPLOY_APP_PRIVATE_KEY }}
  PULSE_REQUIRE_ENCRYPTED_STATE: "true"
permissions:
  contents: read
  actions: read
concurrency:
  group: pulse-github-daily
  cancel-in-progress: false
jobs:
  plan:
    if: vars.PULSE_AUTOMATION_ENABLED != 'false' && (github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    outputs:
      date: ${{ steps.plan.outputs.date }}
      live: ${{ steps.plan.outputs.live }}
      game_start: ${{ steps.plan.outputs.game_start }}
      phase: ${{ steps.plan.outputs.phase }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: YasarGny/YasarGny.github.io
          ref: main
          path: .published
          persist-credentials: false
      - id: plan
        env:
          PULSE_EVENT: ${{ github.event_name }}
          PULSE_CRON: ${{ github.event.schedule }}
          LIVE_APPROVED: ${{ vars.PULSE_LIVE_APPROVED }}
          REQUEST_LIVE: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        run: |
          python - <<'PY'
          import datetime as dt, os
          from zoneinfo import ZoneInfo
          from pulse.publication import expected_date
          from pulse.schedule import phase
          date=dt.date.fromisoformat(expected_date(dt.datetime.now(ZoneInfo('Europe/Istanbul'))))
          from pulse.publication import game_start_from_site, read_json
          start=game_start_from_site('.published',date.isoformat())
          armed=read_json('pulse/deployment.json').get('live_enabled') is True
          live=armed and os.environ['LIVE_APPROVED']=='true' and os.environ['REQUEST_LIVE']=='true'
          if os.environ['REQUEST_LIVE']=='true' and not live:
              raise SystemExit('Live publication needs final approval, live_enabled=true and PULSE_LIVE_APPROVED=true. Use dry_run first.')
          current=read_json('.published/data/publication.json')
          production_phase=phase(os.environ['PULSE_EVENT'],os.environ['PULSE_CRON'],current,date.isoformat())
          if production_phase=='complete':
              print('Today is already published; no research, script, voice or backup work is needed.')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'date={date.isoformat()}\nlive={str(live).lower()}\ngame_start={start}\nphase={production_phase}\n')
          PY
  gate:
    needs: plan
    if: vars.PULSE_AUTOMATION_ENABLED != 'false' && (needs.plan.outputs.live == 'true' && needs.plan.outputs.phase != 'complete')
    runs-on: ubuntu-24.04
    environment: pulse-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-runtime
      - name: Do not close the previous issue before 06:00
        env:
          PULSE_DATE: ${{ needs.plan.outputs.date }}
        run: python -c "import os; from pulse.pipeline import wait_for; wait_for(os.environ['PULSE_DATE'], '06:00')"
      - uses: ./.github/actions/deploy-site
        env:
          PULSE_DRIVE_ENABLED: ${{ vars.PULSE_DRIVE_ENABLED }}
          PULSE_DRIVE_FOLDER_ID: ${{ vars.PULSE_DRIVE_FOLDER_ID }}
          PULSE_DRIVE_CLIENT_ID: ${{ secrets.PULSE_DRIVE_CLIENT_ID }}
          PULSE_DRIVE_CLIENT_SECRET: ${{ secrets.PULSE_DRIVE_CLIENT_SECRET }}
          PULSE_DRIVE_REFRESH_TOKEN: ${{ secrets.PULSE_DRIVE_REFRESH_TOKEN }}
        with:
          mode: prepare
          date: ${{ needs.plan.outputs.date }}
          app-id: ${{ vars.PULSE_DEPLOY_APP_ID }}
          private-key: ${{ secrets.PULSE_DEPLOY_APP_PRIVATE_KEY }}
  generate:
    needs: [plan, gate]
    if: vars.PULSE_AUTOMATION_ENABLED != 'false' && (always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.phase == 'produce' && (needs.gate.result == 'success' || needs.gate.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    outputs:
      date: ${{ needs.plan.outputs.date }}
      has_site: ${{ steps.build.outputs.available }}
    env:
      PULSE_DATE: ${{ needs.plan.outputs.date }}
      PULSE_GAME_START_DATE: ${{ needs.plan.outputs.game_start }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: ./.github/actions/setup-runtime
      - uses: actions/checkout@v4
        with:
          repository: YasarGny/YasarGny.github.io
          ref: main
          path: .published
          persist-credentials: false
      - name: Restore today's checkpoint
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVISION_AUDIO: ${{ inputs.refresh_audio == true }}
          REVISION_MEDIA: ${{ inputs.refresh_media == true }}
          REVISION_EXPANDED: ${{ inputs.expanded_issue == true }}
        run: |
          python - <<'PY'
          import os
          from pulse.publication import read_json
          from scripts.state import restore
          current=read_json('.published/data/publication.json')
          revision=any(os.environ[k]=='true' for k in ('REVISION_AUDIO','REVISION_MEDIA','REVISION_EXPANDED'))
          if current.get('status')=='ready' and current.get('publish_date')==os.environ['PULSE_DATE'] and not revision:
              print('Use the verified published edition; do not restore a superseded private checkpoint.')
          else:
              restore(os.environ['GITHUB_REPOSITORY'],os.environ['PULSE_DATE'],'.pulse-work')
          PY
      - name: Begin research at 06:15 without waiting for another cron delivery
        run: python -c "import os; from pulse.pipeline import wait_for; wait_for(os.environ['PULSE_DATE'], '06:15')"
      - name: Research, edit, synthesize and validate both publications
        id: edition
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PULSE_SCRIPT_MODEL: ${{ vars.PULSE_SCRIPT_MODEL || 'gemini-3.8-flash' }}
          PULSE_TTS_MODEL: ${{ vars.PULSE_TTS_MODEL || 'gemini-3.8-flash-tts' }}
          PULSE_YASAR_VOICE_ID: voice_glt4mz1jtaeh
          PULSE_NECDET_VOICE_ID: voice_8nqcoox86z5q
          REFRESH_AUDIO: ${{ inputs.refresh_audio == true }}
          REFRESH_MEDIA: ${{ inputs.refresh_media == true }}
          EXPANDED_ISSUE: ${{ inputs.expanded_issue == true }}
        run: |
          if [ "$REFRESH_AUDIO" = 'true' ] && [ "$REFRESH_MEDIA" = 'true' ]; then
            echo "Choose one revision mode at a time."
            exit 1
          fi
          if [ "$EXPANDED_ISSUE" = 'true' ]; then
            if [ "$REFRESH_AUDIO" = 'true' ] || [ "$REFRESH_MEDIA" = 'true' ]; then
              echo "Choose expanded_issue without another revision mode."
              exit 1
            fi
            python -m pulse.pipeline --date "$PULSE_DATE" --game-start "$PULSE_GAME_START_DATE" --previous .published --expanded
            echo "release_path=.pulse-work/$PULSE_DATE/expanded-v1" >> "$GITHUB_OUTPUT"
          elif [ "$REFRESH_MEDIA" = 'true' ]; then
            media_path=".pulse-media/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            if [ -f ".pulse-work/$PULSE_DATE/expanded-v1/release.json" ]; then
              python -m pulse.media_refresh --published .published --release ".pulse-work/$PULSE_DATE/expanded-v1" --prefer-original --output "$media_path" --checkpoint ".pulse-work/$PULSE_DATE"
            else
              python -m pulse.media_refresh --published .published --prefer-original --output "$media_path" --checkpoint ".pulse-work/$PULSE_DATE"
            fi
            echo "release_path=$media_path" >> "$GITHUB_OUTPUT"
          elif [ "$REFRESH_AUDIO" = 'true' ]; then
            python -m pulse.pipeline --date "$PULSE_DATE" --game-start "$PULSE_GAME_START_DATE" --previous .published --refresh-audio
            audio_revision=$(python -c "from pulse.pipeline import AUDIO_REVISION; print(AUDIO_REVISION)")
            echo "release_path=.pulse-work/$PULSE_DATE/audio-v$audio_revision" >> "$GITHUB_OUTPUT"
          else
            python -m pulse.pipeline --date "$PULSE_DATE" --game-start "$PULSE_GAME_START_DATE" --previous .published
            echo "release_path=.pulse-work/$PULSE_DATE" >> "$GITHUB_OUTPUT"
          fi
      - name: Show pronunciation review hints without generating any extra audio
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('.pulse-work') / os.environ['PULSE_DATE']
          reports = sorted(root.rglob('pronunciation-review.json'))
          if reports:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('## Telaffuz kontrol listesi\n\nBunlar otomatik adaylardır; doğru telaffuz onayı değildir. Bilinmeyen adlar otomatik değiştirilmez.\n\n')
                  for path in reports:
                      summary.write('### ' + str(path.parent.relative_to(root)) + '\n\n')
                      for kind, report in json.loads(path.read_text()).items():
                          names = ', '.join(item['name'] for item in report['candidates'][:20]) or 'Yok'
                          summary.write(f"- {kind}: {len(report['replacements'])} sözlük dönüşümü; {report['candidate_count']} kontrol adayı. {names}\n")
                  summary.write('\nAyrıntılar özel pulse-state artifact içindeki pronunciation-review.json dosyalarında.\n')
          PY
      - name: Reuse the public transcription model cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: pulse-whisper-small-${{ runner.os }}-v1
      - name: Required final-audio chapter analysis (never regenerates voices)
        if: vars.PULSE_TECH_PODCAST_ENABLED != 'false' || vars.PULSE_GAME_PODCAST_ENABLED != 'false'
        id: chapters
        timeout-minutes: 45
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PULSE_SCRIPT_MODEL: ${{ vars.PULSE_SCRIPT_MODEL || 'gemini-3.8-flash' }}
          RELEASE_PATH: ${{ steps.edition.outputs.release_path }}
          HF_HUB_DISABLE_XET: '1'
        run: |
          python -m pip install -r requirements-chapters.txt
          python scripts/prepare_chapters.py --release "$RELEASE_PATH" --previous .published
      - name: Report required chapter availability
        if: always()
        env:
          CHAPTER_OUTCOME: ${{ steps.chapters.outcome }}
        run: |
          echo "Podcast chapter analysis: $CHAPTER_OUTCOME. Unverified or missing metadata blocks the release; original audio is preserved." >> "$GITHUB_STEP_SUMMARY"
      - name: Build only inside the verified publication window; otherwise save the ready checkpoint
        id: build
        env:
          RELEASE_PATH: ${{ steps.edition.outputs.release_path }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from pulse.schedule import build_available
          from pulse.release_checks import check
          check(os.environ['RELEASE_PATH'], '.published')
          available=build_available(os.environ['PULSE_DATE'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'available={str(available).lower()}\n')
          if available:
              subprocess.run([sys.executable,'-m','pulse.build','--release',os.environ['RELEASE_PATH'],'--previous','.published'],check=True)
          else:
              print('Complete morning checkpoint retained. The 07:30 scheduled run will build and publish it; no runner waits idle.')
          PY
      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.available == 'true'
        with:
          name: pulse-site-${{ github.run_id }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
      - name: Summarize provider-reported usage without prompts or credentials
        if: always()
        run: python -m pulse.usage --work ".pulse-work/$PULSE_DATE"
      - name: Save encrypted intermediate stages, also after failures
        if: always()
        uses: ./.github/actions/save-state
        with:
          name: pulse-state-${{ env.PULSE_DATE }}-${{ github.run_id }}-${{ github.run_attempt }}
          source: .pulse-work/
  publish:
    permissions:
      contents: read
      actions: write
    needs: [plan, generate]
    if: vars.PULSE_AUTOMATION_ENABLED != 'false' && (needs.plan.outputs.live == 'true' && needs.plan.outputs.phase != 'complete' && needs.generate.outputs.has_site == 'true')
    runs-on: ubuntu-24.04
    environment: pulse-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-runtime
      - uses: actions/download-artifact@v4
        with:
          name: pulse-site-${{ github.run_id }}
          path: dist
      - name: Refuse a queued release after its date expires
        env:
          PULSE_DATE: ${{ needs.plan.outputs.date }}
        run: |
          python - <<'PY'
          import os
          from pulse.publication import expected_date, now, not_before
          date=os.environ['PULSE_DATE']
          if expected_date(now())!=date or now()<not_before(date):
              raise SystemExit('Publication is stale or too early')
          PY
      - uses: ./.github/actions/deploy-site
        env:
          PULSE_DRIVE_ENABLED: ${{ vars.PULSE_DRIVE_ENABLED }}
          PULSE_DRIVE_FOLDER_ID: ${{ vars.PULSE_DRIVE_FOLDER_ID }}
          PULSE_DRIVE_CLIENT_ID: ${{ secrets.PULSE_DRIVE_CLIENT_ID }}
          PULSE_DRIVE_CLIENT_SECRET: ${{ secrets.PULSE_DRIVE_CLIENT_SECRET }}
          PULSE_DRIVE_REFRESH_TOKEN: ${{ secrets.PULSE_DRIVE_REFRESH_TOKEN }}
        with:
          mode: release
          date: ${{ needs.plan.outputs.date }}
          app-id: ${{ vars.PULSE_DEPLOY_APP_ID }}
          private-key: ${{ secrets.PULSE_DEPLOY_APP_PRIVATE_KEY }}
      - name: Retain only useful temporary Actions artifacts after verified publication
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULSE_DATE: ${{ needs.plan.outputs.date }}
        run: python scripts/cleanup_artifacts.py --repo "$GITHUB_REPOSITORY" --date "$PULSE_DATE" --run-id "$GITHUB_RUN_ID"
