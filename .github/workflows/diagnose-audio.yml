name: Diagnose Notion Audio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - diagnose_notion_audio.py
      - .github/workflows/diagnose-audio.yml
permissions:
  contents: write
concurrency:
  group: notion-audio-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install diagnostics
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests
      - name: Check Notion-hosted audio
        id: check
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python diagnose_notion_audio.py
      - name: Save diagnostics in repository
        if: always()
        run: |
          if [ ! -f audio-diagnostics.json ]; then
            printf '{"status":"error","error_message":"Diagnostic process ended before report creation"}\n' > audio-diagnostics.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio-diagnostics.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Notion audio diagnostic results [skip ci]"
            git push
          fi
      - name: Mark diagnostic failure
        if: steps.check.outcome == 'failure'
        run: exit 1
