name: Publish reviewed website without regenerating content
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pulse-github-daily
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: pulse-production
    env:
      PULSE_DRIVE_ENABLED: ${{ vars.PULSE_DRIVE_ENABLED }}
      PULSE_DRIVE_FOLDER_ID: ${{ vars.PULSE_DRIVE_FOLDER_ID }}
      PULSE_DRIVE_CLIENT_ID: ${{ secrets.PULSE_DRIVE_CLIENT_ID }}
      PULSE_DRIVE_CLIENT_SECRET: ${{ secrets.PULSE_DRIVE_CLIENT_SECRET }}
      PULSE_DRIVE_REFRESH_TOKEN: ${{ secrets.PULSE_DRIVE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check production and backup authorization
        env:
          LIVE_APPROVED: ${{ vars.PULSE_LIVE_APPROVED }}
        run: |
          python - <<'PY'
          import json, os
          assert json.load(open('pulse/deployment.json')).get('live_enabled') is True, 'Live publication is disabled'
          assert os.environ['LIVE_APPROVED'] == 'true', 'Live publication is not approved'
          assert os.environ['PULSE_DRIVE_ENABLED'] == 'true', 'A verified Drive backup is required for this rollout'
          PY
      - run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - uses: actions/checkout@v4
        with:
          repository: YasarGny/YasarGny.github.io
          ref: main
          path: .published
          persist-credentials: false
      - name: Rebuild the current verified edition with the reviewed website
        id: build
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from pulse.build import build
          from pulse.publication import read_json
          current = read_json('.published/data/publication.json')
          assert current['status'] == 'ready', 'Wait for a complete current edition before a website-only rollout'
          # build() verifies the manifest, every MP3 and the actual publication window.
          result = build('site', 'dist', release=Path('.published/releases') / current['release_id'])
          assert result == current, 'A website-only rollout must preserve the publication identity'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('date=' + result['publish_date'] + '\n')
          PY
      - uses: ./.github/actions/deploy-site
        with:
          mode: release
          date: ${{ steps.build.outputs.date }}
          app-id: ${{ vars.PULSE_DEPLOY_APP_ID }}
          private-key: ${{ secrets.PULSE_DEPLOY_APP_PRIVATE_KEY }}
          refresh-backup: "true"
