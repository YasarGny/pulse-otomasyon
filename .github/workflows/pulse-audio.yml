name: PULSE Daily Publication
on:
  workflow_dispatch:
  schedule:
    - cron: "50 6 * * *"
      timezone: "Europe/Istanbul"
permissions:
  contents: write
concurrency:
  group: pulse-daily-audio
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install requests edge-tts
      - name: Generate daily narration and Yeni Sekme podcast
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PULSE_YASAR_VOICE_ID: voice_glt4mz1jtaeh
          PULSE_NECDET_VOICE_ID: voice_8nqcoox86z5q
        run: python pulse_publish.py
      - name: Publish audio to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-player/latest.mp3 web-player/latest.json web-player/podcast-latest.mp3 web-player/podcast-latest.json
          if git diff --cached --quiet; then
            echo "No audio changes."
          else
            git commit -m "Publish PULSE audio for $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
