name: PULSE Daily Audio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pulse_audio.py'
      - '.github/workflows/pulse-audio.yml'
  schedule:
    - cron: "20 6 * * *"
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install edge-tts requests
      - name: Create and upload audio
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          REPAIR_AUDIO: "1"
        run: python pulse_audio.py
