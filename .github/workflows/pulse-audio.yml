name: PULSE Daily Audio
on:
  workflow_dispatch:
  schedule:
    - cron: "40 6 * * *"
permissions:
  contents: write
concurrency:
  group: pulse-daily-audio
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install requests
      - name: Generate real daily narration
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PULSE_SUMMARY_VOICE_ID: ${{ vars.PULSE_SUMMARY_VOICE_ID }}
        run: python pulse_audio.py
      - name: Publish audio to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-player/latest.mp3 web-player/latest.json
          if git diff --cached --quiet; then
            echo "No audio changes."
          else
            git commit -m "Publish PULSE audio for $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
