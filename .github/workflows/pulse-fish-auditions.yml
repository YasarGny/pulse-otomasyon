name: Yeni Sekme Fish Audio Ses Secmeleri
on:
  workflow_dispatch:
    inputs:
      yasar_reference_id:
        description: "Yasar Fish Audio reference_id"
        required: true
        type: string
      necdet_reference_id:
        description: "Necdet Fish Audio reference_id"
        required: true
        type: string
permissions:
  contents: read
jobs:
  auditions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'fish-audio-sdk'
      - name: Generate six isolated voice samples
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          YASAR_REFERENCE_ID: ${{ inputs.yasar_reference_id }}
          NECDET_REFERENCE_ID: ${{ inputs.necdet_reference_id }}
        run: python pulse_fish_auditions.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fish-audio-voice-auditions
          path: fish-auditions/
          retention-days: 7
