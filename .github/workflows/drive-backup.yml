name: Verify private Drive backup
on:
  workflow_dispatch:
env:
  PULSE_AUTOMATION_ENABLED: ${{ vars.PULSE_AUTOMATION_ENABLED }}
  PULSE_SITE_ENABLED: ${{ vars.PULSE_SITE_ENABLED }}
  PULSE_TECH_PODCAST_ENABLED: ${{ vars.PULSE_TECH_PODCAST_ENABLED }}
  PULSE_GAME_PODCAST_ENABLED: ${{ vars.PULSE_GAME_PODCAST_ENABLED }}
permissions:
  contents: read
concurrency:
  group: pulse-github-daily
  cancel-in-progress: false
jobs:
  verify:
    if: vars.PULSE_AUTOMATION_ENABLED != 'false' && (github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    environment: pulse-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - uses: actions/checkout@v4
        with:
          repository: YasarGny/YasarGny.github.io
          ref: main
          path: .published
          persist-credentials: false
      - name: Archive and fully read back every historical release; retain only the verified latest version of each day
        env:
          PULSE_DRIVE_FOLDER_ID: ${{ vars.PULSE_DRIVE_FOLDER_ID }}
          PULSE_DRIVE_CLIENT_ID: ${{ secrets.PULSE_DRIVE_CLIENT_ID }}
          PULSE_DRIVE_CLIENT_SECRET: ${{ secrets.PULSE_DRIVE_CLIENT_SECRET }}
          PULSE_DRIVE_REFRESH_TOKEN: ${{ secrets.PULSE_DRIVE_REFRESH_TOKEN }}
        run: python -m pulse.drive_backup --source site --published .published
