name: Remove Unwanted Meeting Notes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/remove-meeting-notes.yml]
permissions:
  contents: read
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python remove_meeting_notes_once.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
