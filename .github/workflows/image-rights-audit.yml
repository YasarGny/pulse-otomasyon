name: Audit current image rights evidence
on:
  workflow_dispatch:
env:
  PULSE_AUTOMATION_ENABLED: ${{ vars.PULSE_AUTOMATION_ENABLED }}
  PULSE_SITE_ENABLED: ${{ vars.PULSE_SITE_ENABLED }}
  PULSE_TECH_PODCAST_ENABLED: ${{ vars.PULSE_TECH_PODCAST_ENABLED }}
  PULSE_GAME_PODCAST_ENABLED: ${{ vars.PULSE_GAME_PODCAST_ENABLED }}
permissions:
  contents: read
jobs:
  audit:
    if: vars.PULSE_AUTOMATION_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Collect article credits and policy evidence without AI or publishing
        run: python scripts/audit_image_rights.py
      - uses: actions/upload-artifact@v4
        with:
          name: image-rights-audit
          path: image-rights-audit.json
          retention-days: 7
