name: Sync PULSE Player Embed
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - web-player/index.html
      - sync_player_embed.py
      - .github/workflows/sync-player-embed.yml
permissions:
  contents: read
concurrency:
  group: pulse-embed-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Refresh Notion player URL on HTML changes
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python sync_player_embed.py
