name: Test Private Web Audio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - test_embedded_audio.py
      - .github/workflows/test-private-audio.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Create private embedded audio player in Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python test_embedded_audio.py
