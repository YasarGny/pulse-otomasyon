name: PULSE Duo Pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pulse_duo_pilot.py
      - .github/workflows/pulse-duo-pilot.yml
permissions:
  contents: write
concurrency:
  group: pulse-duo-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install edge-tts requests
      - name: Generate two-host pilot
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python pulse_duo_pilot.py
      - name: Publish pilot only (leave daily audio unchanged)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-player/pilot-duo.mp3 web-player/pilot-duo.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish PULSE Duo pilot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
