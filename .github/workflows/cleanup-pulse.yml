name: PULSE One-Time Notion Cleanup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - cleanup_pulse_once.py
      - .github/workflows/cleanup-pulse.yml
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Clean old Notion test blocks
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python cleanup_pulse_once.py
