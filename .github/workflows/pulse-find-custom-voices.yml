name: PULSE Find Saved Gemini Voices
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  find-voices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List custom voices (read-only, no TTS generation)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse
          key = os.environ.get("GEMINI_API_KEY")
          if not key:
              raise SystemExit("GEMINI_API_KEY secret is missing")
          base = "https://generativelanguage.googleapis.com/v1beta/voices"
          matches = []
          page_token = None
          seen = set()
          for page in range(20):
              url = base + ("?pageToken=" + urllib.parse.quote(page_token) if page_token else "")
              req = urllib.request.Request(url, headers={"x-goog-api-key": key})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = json.load(resp)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")[:400]
                  raise SystemExit(f"Voice listing failed HTTP {exc.code}: {body}")
              for voice in data.get("voices", []):
                  name = voice.get("displayName") or voice.get("display_name") or ""
                  if name.casefold().strip() in ("pulse - yasar 3", "pulse - necdet 3"):
                      matches.append({"name": name, "id": voice.get("id"), "type": voice.get("type")})
              page_token = data.get("nextPageToken") or data.get("next_page_token")
              if not page_token or page_token in seen:
                  break
              seen.add(page_token)
          print("=== MATCHING SAVED VOICES ===")
          print(json.dumps(matches, ensure_ascii=False, indent=2))
          if len(matches) < 2:
              print("Not both voices found. Ensure the GitHub API key belongs to the same Google AI Studio project where the voices were created.")
          PY
